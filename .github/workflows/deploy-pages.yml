name: Deploy GitHub Pages

# Manual only. Production is Cloudflare Pages (apa-v1.pages.dev). The GitHub Pages
# copy is the May 2026 static demo; its demo mode (VITE_PAGES_DEMO + demo provider)
# no longer exists in the code, so rebuilding it would replace a working demo with
# an app that has no backend. Run this only if you mean to replace or retire it.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            kiosk/package-lock.json
      - run: npm ci
      - run: npm ci --prefix kiosk
      - run: npm run typecheck
      - run: npm run build --prefix kiosk
        env:
          GITHUB_PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: kiosk/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
